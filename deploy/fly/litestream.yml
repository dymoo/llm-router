# Continuous replication of the control plane to Backblaze B2 (S3 API).
# Credentials: LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY (Fly secrets).
# Batch content (batch-content/) is deliberately not replicated: see docs/operations.md.
# Daily snapshots kept a week; restore to any point in that window (docs/operations.md).
snapshot:
  interval: 24h
  retention: 168h
dbs:
  - path: /var/lib/llm-router/control.sqlite
    replica:
      type: s3
      bucket: dylans-llm-router-litestream
      path: ${LITESTREAM_PATH}
      endpoint: https://s3.eu-central-003.backblazeb2.com
      region: eu-central-003
      force-path-style: true
