[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-service"
version = "0.1.0"
description = "Local Laya HTTP classifier with CPU PyTorch and fail-closed Ryzen AI 1.8 NPU backends."
requires-python = ">=3.11"
dependencies = [
  "laya==0.3.4",
  "numpy>=1.26",
  "huggingface_hub>=0.24",
  "safetensors>=0.4",
  "transformers>=4.44",
  "torch>=2.4",
]

[project.optional-dependencies]
export = ["onnx>=1.16", "onnxscript>=0.1"]
cpu-ort = ["onnxruntime>=1.19"]

[project.scripts]
laya-service = "laya_service.__main__:main"

[tool.setuptools.packages.find]
include = ["laya_service*"]

[tool.setuptools.package-data]
laya_service = ["npu/vai_ep_config.json"]
